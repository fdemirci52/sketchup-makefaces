<title>Pafta Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root {
  /* Layout: çizim masası — solda dar mürekkep rayı, sağda geniş çalışma yüzeyi; ekran görüntüleri ve paftalar yüzeyin üstünde kâğıt gibi durur */
  --bg: #E5E9E6;
  --panel: #F2F4F2;
  --card: #FFFFFF;
  --ink: #15201B;
  --ink-2: #43504A;
  --ink-3: #6D7973;
  --line: #C5CDC9;
  --line-2: #DBE1DD;
  --accent: #2443B3;
  --on-accent: #FFFFFF;
  --accent-weak: #DDE4F7;
  --rev: #C4361F;
  --rev-weak: #F7DFD8;
  --rev-fill: rgba(196, 54, 31, .10);
  --ok: #2B7348;
  --ok-weak: #D8EDDF;
  --warn: #946010;
  --warn-weak: #F4E7CD;
  --c1: #5B6C8E; --c2: #2D7D77; --c3: #8B4E7E; --c4: #A26E22;
  --stage: #2B312F;
  --sheet-bg: #D3D9D5;
  --paper: #FFFFFF;
  --shadow: 0 1px 2px rgba(18, 30, 24, .07), 0 4px 14px rgba(18, 30, 24, .06);
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --panel: #161D1A; --card: #1C2421; --ink: #E2E8E4; --ink-2: #A6B1AB; --ink-3: #7A8680;
    --line: #2F3A35; --line-2: #242D29; --accent: #8DA4FF; --on-accent: #0D1430; --accent-weak: #222C4D;
    --rev: #FF7B5F; --rev-weak: #3B2019; --rev-fill: rgba(255, 123, 95, .14); --ok: #6DC892; --ok-weak: #16301F;
    --warn: #E4A84D; --warn-weak: #33270F; --c1: #93A6CF; --c2: #6CC2BA; --c3: #D195C4; --c4: #DDA857;
    --stage: #0B0F0E; --sheet-bg: #0C110F; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --panel: #161D1A; --card: #1C2421; --ink: #E2E8E4; --ink-2: #A6B1AB; --ink-3: #7A8680;
  --line: #2F3A35; --line-2: #242D29; --accent: #8DA4FF; --on-accent: #0D1430; --accent-weak: #222C4D;
  --rev: #FF7B5F; --rev-weak: #3B2019; --rev-fill: rgba(255, 123, 95, .14); --ok: #6DC892; --ok-weak: #16301F;
  --warn: #E4A84D; --warn-weak: #33270F; --c1: #93A6CF; --c2: #6CC2BA; --c3: #D195C4; --c4: #DDA857;
  --stage: #0B0F0E; --sheet-bg: #0C110F; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--ink-3); }
.eyebrow { font: 500 11px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- shell */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: auto; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 20px;
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
.brand { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; }
.brand span { font: 750 19px/1 var(--f-display); font-stretch: 78%; letter-spacing: .01em; text-transform: uppercase; }
.proj { display: grid; gap: 6px; }
.proj select { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); font-weight: 500; }
.proj-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.chip-sample { font: 500 10.5px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; background: var(--warn-weak); color: var(--warn); }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r); color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--card); color: var(--ink); }
.nav a.on { background: var(--ink); color: var(--panel); }
.nav .count { font: 500 11.5px var(--f-mono); opacity: .75; font-variant-numeric: tabular-nums; }
.rail-foot { margin-top: auto; display: flex; gap: 10px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; }
.rail-foot small { display: block; color: var(--ink-3); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 4px; background: var(--ink-3); }
.dot.off { background: transparent; border: 2px solid var(--ink-3); }
.main { min-width: 0; padding-block: 22px 60px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .proj { flex: 1 1 200px; grid-template-columns: auto 1fr; align-items: center; }
  .proj .lbl { display: none; }
  .proj-meta { display: none; }
  .nav { display: flex; overflow-x: auto; width: 100%; gap: 4px; }
  .nav a { flex: none; padding: 6px 10px; }
  .rail-foot { display: none; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
}

/* ---------- common */
.vh { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.vh h1 { font: 760 30px/1.05 var(--f-display); font-stretch: 80%; letter-spacing: -.005em; margin-top: 4px; }
.vh-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--panel); }
.btn.danger { color: var(--rev); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn svg { width: 15px; height: 15px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 11px/1 var(--f-mono); letter-spacing: .03em; padding: 4px 8px; border-radius: 999px; background: var(--panel); color: var(--ink-2); border: 1px solid var(--line-2); white-space: nowrap; }
.st-taslak, .st-hazirlaniyor, .st-done { background: var(--panel); color: var(--ink-2); }
.st-claudeda, .st-gonderildi { background: var(--accent-weak); color: var(--accent); border-color: transparent; }
.st-kontrol { background: var(--warn-weak); color: var(--warn); border-color: transparent; }
.st-onay { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
.st-revizyon { background: var(--rev-weak); color: var(--rev); border-color: transparent; }
.st-claudeda::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.code { font: 600 12px var(--f-mono); color: var(--ink-2); letter-spacing: .02em; }
.ver { display: inline-flex; align-items: center; gap: 3px; font: 600 12px var(--f-mono); color: var(--rev); }
.tri { width: 9px; height: 8px; fill: var(--rev); flex: none; }
.tchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.tdot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.tdot.c1 { background: var(--c1); } .tdot.c2 { background: var(--c2); } .tdot.c3 { background: var(--c3); } .tdot.c4 { background: var(--c4); }
.card { background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; padding: 16px; }
.card h2 { font: 700 15px/1.2 var(--f-display); font-stretch: 88%; letter-spacing: .01em; }
.notice { max-width: 560px; margin: 8vh auto 0; text-align: left; display: grid; gap: 10px; }
.notice h2 { font: 760 24px/1.1 var(--f-display); font-stretch: 82%; }
.notice p { color: var(--ink-2); }
.fld { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.fld > span { font-weight: 500; }
.fld input, .fld select, .fld textarea, .inp { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink); font-size: 13.5px; }
.fld textarea, textarea.inp { resize: vertical; min-height: 58px; line-height: 1.4; }
.fld input::placeholder, .fld textarea::placeholder, .inp::placeholder { color: var(--ink-3); opacity: .8; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.check input { width: 15px; height: 15px; accent-color: var(--accent); }
.hint { font-size: 12.5px; color: var(--ink-3); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.sec-h h2, .sec-h h3 { font: 700 13px/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }

/* ---------- board */
.strip { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; margin-bottom: 14px; }
.strip b { font: 600 14px var(--f-mono); color: var(--ink); margin-right: 3px; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
@media (max-width: 1180px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 10px; display: grid; gap: 10px; }
.col-h { display: flex; justify-content: space-between; align-items: center; padding: 2px 2px 0; }
.col-n { font: 500 12px var(--f-mono); color: var(--ink-3); }
.col-empty { font-size: 12.5px; color: var(--ink-3); padding: 14px 4px; border: 1px dashed var(--line); border-radius: var(--r); text-align: center; }
.rcard { display: block; background: var(--card); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; color: var(--ink); text-decoration: none; box-shadow: var(--shadow); }
.rcard:hover { border-color: var(--ink-3); }
.thumb { aspect-ratio: 16 / 10; background: var(--stage); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rc-b { padding: 10px 11px 11px; display: grid; gap: 5px; }
.rc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rc-top .ver { margin-left: auto; }
.rcard h3 { font-size: 14px; font-weight: 600; line-height: 1.3; }
.rc-m { font-size: 12px; color: var(--ink-3); }
.rc-m.attn { color: var(--warn); font-weight: 500; }

/* ---------- talep detail */
.dh { display: grid; gap: 8px; margin-bottom: 16px; }
.back { font-size: 13px; text-decoration: none; color: var(--ink-3); width: max-content; }
.back:hover { color: var(--ink); }
.dh-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.dh-title { display: grid; gap: 4px; min-width: 0; }
.dh-title h1 { font: 760 28px/1.08 var(--f-display); font-stretch: 80%; }
.dh-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.dgrid { display: grid; grid-template-columns: 200px minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1320px) { .dgrid { grid-template-columns: 190px minmax(0, 1fr); } .pcol { grid-column: 1 / -1; } }
@media (max-width: 860px) { .dgrid { grid-template-columns: minmax(0, 1fr); } .ccol { order: -1; } }
.vcol { display: grid; gap: 8px; }
.vlist { display: grid; gap: 6px; }
.vitem { display: grid; gap: 4px; text-align: left; padding: 9px 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--card); cursor: pointer; }
.vitem:hover { border-color: var(--ink-3); }
.vitem.on { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--rev); }
.vh1 { display: flex; align-items: center; gap: 6px; font: 600 13px var(--f-mono); color: var(--rev); }
.vh1 .pill { margin-left: auto; }
.vm { font-size: 12px; color: var(--ink-3); }
.vs { font-size: 12px; color: var(--ink-2); line-height: 1.35; }
.ccol { display: grid; gap: 10px; min-width: 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { padding: 7px 12px; border: 0; background: transparent; cursor: pointer; font-size: 13px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.stage { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--stage); border-radius: var(--r); overflow: hidden; user-select: none; -webkit-user-select: none; }
.stage > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.stage[data-draw] { cursor: crosshair; touch-action: none; }
.marks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.mk-rect { fill: var(--rev-fill); stroke: var(--rev); stroke-width: 2; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
.mk-badge { position: absolute; transform: translate(-50%, -50%); min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; border: 2px solid #fff; background: var(--rev); color: #fff; font: 700 12px/20px var(--f-mono); text-align: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
.mk-temp { position: absolute; border: 2px dashed var(--rev); background: var(--rev-fill); pointer-events: none; }
.stage-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.drop { aspect-ratio: 16 / 10; max-width: 100%; border: 2px dashed var(--line); border-radius: 8px; display: grid; place-items: center; text-align: center; padding: 20px; background: var(--panel); color: var(--ink-2); }
.drop.over { border-color: var(--accent); background: var(--accent-weak); }
.drop b { display: block; font: 700 17px/1.2 var(--f-display); font-stretch: 85%; color: var(--ink); margin-bottom: 6px; }
.drop kbd { font: 600 12px var(--f-mono); padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--card); }
.drop .btn { margin-top: 12px; }
.drop.slim { aspect-ratio: auto; padding: 18px; }
.compare { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--stage); border-radius: var(--r); overflow: hidden; --pos: 50%; }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.cmp-b { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); pointer-events: none; }
.cmp-line::after { content: "◂ ▸"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #222; font: 700 11px/1 var(--f-mono); padding: 6px 7px; border-radius: 12px; white-space: nowrap; }
.cmp-lbl { position: absolute; top: 10px; font: 600 11px/1 var(--f-mono); letter-spacing: .05em; padding: 5px 7px; border-radius: 3px; background: rgba(0, 0, 0, .62); color: #fff; pointer-events: none; }
.cmp-lbl.l { left: 10px; } .cmp-lbl.r { right: 10px; }
.cmp-range { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.compare:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.pcol { display: grid; gap: 14px; min-width: 0; }
.pcol .card { display: grid; gap: 12px; }
.pins { display: grid; gap: 8px; }
.pin-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 28px; gap: 8px; align-items: start; }
.pin-no { width: 24px; height: 24px; border-radius: 12px; background: var(--rev); color: #fff; font: 700 12px/24px var(--f-mono); text-align: center; margin-top: 4px; }
.pin-row textarea { min-height: 40px; }
.pin-row .btn { padding: 4px; margin-top: 3px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.prompt-pre { font: 12px/1.5 var(--f-mono); white-space: pre-wrap; word-break: break-word; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); padding: 10px 12px; max-height: 340px; overflow: auto; margin: 0; color: var(--ink); }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.ai { display: grid; gap: 8px; }
.ai-item { display: grid; gap: 4px; padding: 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--panel); }
.ai-item b { font-size: 13px; font-weight: 600; }
.ai-item p { font-size: 12.5px; color: var(--ink-2); }
.ai-item .btn { justify-self: start; }
.ai-item.added { opacity: .6; }
.thinking { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.sendhint { font-size: 12.5px; color: var(--ink-2); background: var(--accent-weak); border-radius: var(--r); padding: 10px 12px; }

/* ---------- tables */
.tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { font: 500 10.5px var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.row { cursor: pointer; }
.tbl tr.row:hover td { background: var(--panel); }
.tbl tr.open td { background: var(--panel); }
.tbl .no { font: 600 12.5px var(--f-mono); white-space: nowrap; }
.tbl td.num { font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
.xrow td { padding: 0; }
.xbox { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; padding: 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
@media (max-width: 760px) { .xbox { grid-template-columns: minmax(0, 1fr); } }
.revlist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }

function where(p) {
  const cx = p.x + (p.w || 0) / 2, cy = p.y + (p.h || 0) / 2;
  const h = cx < 0.34 ? 'sol' : cx > 0.66 ? 'sağ' : 'orta', v = cy < 0.34 ? 'üst' : cy > 0.66 ? 'alt' : 'orta';
  if (h === 'orta' && v === 'orta') return 'orta';
  if (h === 'orta') return v + ' orta';
  if (v === 'orta') return h + ' orta';
  return h + ' ' + v;
}
function buildPrompt(id, d, n) {
  const r = S.data.requests[id]; if (!r) return '';
  const P = S.data.projects[r.projectId] || {}; const std = P.standards || DEFAULT_STD;
  const sc = r.scope || {}; const o = [];
  o.push(`# ${r.code} · ${r.title} — v${n}`);
  o.push(`Proje: ${P.name || '—'}${P.code ? ' (' + P.code + ')' : ''} · Tür: ${(TYPES[r.type] || {}).uzun || r.type}`);
  o.push(`Kapsam: sahne ${sc.scene ? '"' + sc.scene + '"' : '—'} · tag ${sc.tags || '—'} · bileşen ${sc.comps || '—'}`);
  o.push('');
  if (n === 1) {
    o.push('## Talep');
    const br = d.brief || {};
    (BRIEF[r.type] || []).forEach(([k, label]) => { if (String(br[k] || '').trim()) o.push(`- ${label}: ${String(br[k]).trim()}`); });
  } else {
    const prev = (r.versions || [])[n - 2];
    o.push(`## Revizyon — v${n - 1} üzerine`);
    if (prev && prev.summary) o.push(`v${n - 1}'de yapılan: ${prev.summary}`);
  }
  if (String(d.note || '').trim()) { o.push(''); o.push(String(d.note).trim()); }
  const pins = d.pins || [];
  if (pins.length) {
    o.push(''); o.push('## İşaretli noktalar');
    o.push(d.image ? '(Ekteki görüntüde kırmızı numaralarla gösterildi.)' : '(Görüntü eklenmedi.)');
    pins.forEach((p, i) => o.push(`${i + 1}. [${p.w ? 'Bölge' : 'Nokta'} · ${where(p)}] ${String(p.text || '').trim() || '(not yazılmadı)'}`));
  }
  const opts = d.opts || {};
  o.push(''); o.push('## Çalışma kuralları');
  if (opts.std !== false) {
    lines(std.claudeKurallari).forEach((l) => o.push('- ' + l));
    const tags = lines(std.tagYapisi); if (tags.length) o.push('- Tag yapısı: ' + tags.join(', '));
    if (std.isimlendirme) o.push('- İsimlendirme: ' + std.isimlendirme);
  }
  o.push('- Kapsam dışındaki geometriye dokunma.');
  if (opts.teslim !== false) {
    o.push(''); o.push('## Teslim');
    lines(std.teslimKurallari).forEach((l) => o.push('- ' + l));
    o.push(`- Bitince ${sc.scene ? '"' + sc.scene + '" sahnesinden' : 'aynı açıdan'} ekran görüntüsü al: ${r.code}_v${n}.png`);
    o.push('- Yaptığın değişiklikleri madde madde özetle; değişen bileşenlerin adlarını yaz.');
  }
  return o.join('\n');
}
function canSend(r) {
  const d = r.draft; if (!d) return false;
  if ((d.pins || []).some((p) => String(p.text || '').trim())) return true;
  if (String(d.note || '').trim()) return true;
  if (!(r.versions || []).length && Object.values(d.brief || {}).some((v) => String(v || '').trim())) return true;
  return false;
}

function marksHTML(pins, editable) {
  const rects = pins.filter((p) => p.w > 0).map((p) => `<rect class="mk-rect" x="${MM(p.x * 1000)}" y="${MM(p.y * 625)}" width="${MM(p.w * 1000)}" height="${MM(p.h * 625)}"/>`).join('');
  const badges = pins.map((p, i) => `<button type="button" class="mk-badge" style="left:${MM(p.x * 100)}%;top:${MM(p.y * 100)}%" ${editable ? `data-act="pin-focus" data-id="${esc(p.id)}"` : 'tabindex="-1"'} aria-label="İşaret ${i + 1}">${i + 1}</button>`).join('');
  return `<svg class="marks" viewBox="0 0 1000 625" preserveAspectRatio="none" aria-hidden="true">${rects}</svg>${badges}`;
}
function dropHTML(target, title, sub) {
  return `<div class="drop" data-drop="${target}"><div><b>${title}</b><p>${sub}</p><button class="btn" data-act="pick-image" data-target="${target}">${I.img}Dosya seç</button></div></div>`;
}
function talepHTML() {
  const id = S.route.id; const r = S.data.requests[id];
  if (!r) return notice('Talep bulunamadı', 'Silinmiş ya da başka bir projeye ait olabilir.', '<div><a class="btn" href="#talepler">Taleplere dön</a></div>');
  const vs = r.versions || []; const n = vs.length;
  let sel = S.ui.sel;
  if (sel == null || (sel === 'draft' && !r.draft) || (typeof sel === 'number' && !vs[sel - 1])) sel = r.draft ? 'draft' : n || null;
  S.ui.sel = sel;
  const t = TYPES[r.type] || { ad: r.type, c: 'c1' }; const sc = r.scope || {};
  const acts = [];
  if (r.draft) acts.push(`<button class="btn primary" data-act="send" id="send-btn"${canSend(r) ? '' : ' disabled'}>Claude'a gönder · v${n + 1}</button>`);
  if (r.status === 'claudeda') acts.push(`<button class="btn primary" data-act="pick-image" data-target="result">${I.img}Sonuç görüntüsü ekle</button>`, '<button class="btn" data-act="unsend">Gönderimi geri al</button>');
  if (r.status === 'kontrol') acts.push('<button class="btn primary" data-act="approve">Onayla</button>', '<button class="btn" data-act="revise">Revizyon iste</button>');
  if (r.status === 'onay') acts.push('<button class="btn" data-act="revise">Yeni revizyon aç</button>');
  if (!r.draft && !n) acts.push('<button class="btn primary" data-act="revise">Taslak aç</button>');
  return `<header class="dh"><a class="back" href="#talepler">← Talepler</a>
    <div class="dh-row"><div class="dh-title"><div class="dh-meta"><span class="code">${esc(r.code)}</span><span class="tchip"><i class="tdot ${t.c}"></i>${esc(t.uzun || t.ad)}</span><span class="pill st-${r.status}">${RSTAT[r.status] || r.status}</span></div><h1>${esc(r.title)}</h1>
      <div class="dh-meta"><span>Sahne: <b>${esc(sc.scene || '—')}</b></span><span>Tag: ${esc(sc.tags || '—')}</span>${sc.comps ? `<span>Bileşen: ${esc(sc.comps)}</span>` : ''}</div></div>
      <div class="vh-actions">${acts.join('')}</div></div></header>
  <div class="dgrid">${versionsCol(r, sel)}${canvasCol(r, sel)}${promptCol(r, sel)}</div>`;
}
function versionsCol(r, sel) {
  const vs = r.versions || []; const it = [];
  if (r.draft) it.push(`<button class="vitem${sel === 'draft' ? ' on' : ''}" data-act="vsel" data-v="draft"><span class="vh1">${TRI}v${vs.length + 1}<span class="pill st-taslak">Taslak</span></span><span class="vm">${(r.draft.pins || []).length} işaret${r.draft.image ? '' : ' · görüntü yok'}</span></button>`);
  for (let i = vs.length - 1; i >= 0; i--) {
    const v = vs[i]; const last = i === vs.length - 1;
    const st = last && !r.draft ? [r.status, RSTAT[r.status]] : ['done', 'Revize edildi'];
    it.push(`<button class="vitem${sel === v.n ? ' on' : ''}" data-act="vsel" data-v="${v.n}"><span class="vh1">${TRI}v${v.n}<span class="pill st-${st[0]}">${st[1]}</span></span><span class="vm">${fmtShort(v.sentAt)}${v.minutes != null ? ' · ' + dur(v.minutes) : ''}</span>${v.summary ? `<span class="vs">${esc(clip(v.summary, 96))}</span>` : ''}</button>`);
  }
  return `<aside class="vcol"><p class="eyebrow">Versiyonlar</p><div class="vlist">${it.join('')}</div><button class="btn ghost sm danger" data-act="req-del">Talebi sil</button></aside>`;
}
function canvasCol(r, sel) {
  const vs = r.versions || [];
  if (sel === 'draft') {
    const d = r.draft;
    if (!d.image) return `<section class="ccol">${dropHTML('draft', 'Ekran görüntüsünü yapıştır', "SketchUp'ta sahneyi aç, görüntü al ve burada <kbd>Ctrl</kbd> + <kbd>V</kbd>. Sürükleyip bırakmak da olur.")}<p class="hint">Görüntü olmadan da gönderebilirsin; sağdaki brief ve notlar prompta girer.</p></section>`;
    return `<section class="ccol"><div class="stage-bar"><p class="hint">Tıkla: nokta · sürükle: bölge. Her işaret sağda bir maddeye dönüşür.</p><div class="btn-row"><button class="btn sm" data-act="pick-image" data-target="draft">${I.img}Görüntüyü değiştir</button>${(d.pins || []).length ? '<button class="btn sm ghost" data-act="pins-clear">İşaretleri temizle</button>' : ''}</div></div>
      <div class="stage" data-draw="1" id="stage"><img src="${esc(imgSrc(d.image))}" alt="Taslak ekran görüntüsü">${marksHTML(d.pins || [], true)}</div></section>`;
  }
  const v = vs[sel - 1]; if (!v) return '<section class="ccol"></section>';
  const prev = vs[sel - 2];
  const before = v.image || (prev && prev.result) || null; const after = v.result;
  const tabs = []; if (before && after) tabs.push(['cmp', 'Önce / sonra']); if (v.image) tabs.push(['talep', 'İşaretli talep']); if (after) tabs.push(['sonuc', 'Sonuç']);
  const tab = tabs.some(([k]) => k === S.ui.tab) ? S.ui.tab : (tabs[0] || [null])[0];
  const waiting = sel === vs.length && r.status === 'claudeda' && !after;
  let body = '';
  if (tab === 'cmp') body = `<div class="compare"><img src="${esc(imgSrc(after))}" alt="Sonra"><div class="cmp-b"><img src="${esc(imgSrc(before))}" alt="Önce"></div><div class="cmp-line"></div><span class="cmp-lbl l">ÖNCE · ${v.image ? 'v' + v.n + ' talep' : 'v' + (v.n - 1)}</span><span class="cmp-lbl r">SONRA · v${v.n}</span><input type="range" class="cmp-range" id="cmp-range" min="0" max="100" value="50" aria-label="Önce ve sonra arasında kaydır"></div>`;
  else if (tab === 'talep') body = `<div class="stage"><img src="${esc(imgSrc(v.image))}" alt="v${v.n} işaretli talep görüntüsü">${marksHTML(v.pins || [], false)}</div>`;
  else if (tab === 'sonuc') body = `<div class="stage"><img src="${esc(imgSrc(after))}" alt="v${v.n} sonucu"></div>`;
  const tabsH = tabs.length > 1 ? `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab${k === tab ? ' on' : ''}" role="tab" aria-selected="${k === tab}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</div>` : '';
  const wait = waiting ? `<div class="drop slim" data-drop="result"><div><b>Claude bitirince sonucu buraya yapıştır</b><p>Aynı sahneden alınan görüntüyü <kbd>Ctrl</kbd> + <kbd>V</kbd> ile bırak; talep "Kontrolde"ye geçer ve önce/sonra karşılaştırması açılır.</p><button class="btn" data-act="pick-image" data-target="result">${I.img}Dosya seç</button></div></div>` : '';
  const none = !body && !waiting ? '<p class="hint">Bu versiyonda görüntü yok.</p>' : '';
  return `<section class="ccol">${tabsH}${body}${wait}${none}</section>`;
}
function aiHTML(key, kind) {
  const a = S.ui.ai[key];
  if (!S.sample && !a) return '';
  if (!a || a.state === 'idle') return '';
  if (a.state === 'loading') return `<div class="ai"><div class="thinking"><span class="spin"></span>Claude düşünüyor… ilk yanıt 10–60 sn sürebilir.<button class="btn sm ghost" data-act="ai-stop" data-k="${esc(key)}">Durdur</button></div></div>`;
  if (a.state === 'error') return `<div class="ai"><p class="hint">${esc(a.msg)}</p></div>`;
  if (!a.list.length) return '<div class="ai"><p class="hint">Claude eksik bir nokta bulmadı.</p></div>';
  return `<div class="ai">${a.list.map((x, i) => `<div class="ai-item${a.added[i] ? ' added' : ''}"><b>${esc(x.soru || '')}</b>${x.neden ? `<p>${esc(x.neden)}</p>` : ''}<p>Öneri: ${esc(kind === 'req' ? x.oneri : x.not)}</p><button class="btn sm" data-act="ai-add" data-k="${esc(key)}" data-i="${i}"${a.added[i] ? ' disabled' : ''}>${a.added[i] ? 'Eklendi' : kind === 'req' ? 'Nota ekle' : 'Paftaya not ekle'}</button></div>`).join('')}</div>`;
}
function promptCol(r, sel) {
  const vs = r.versions || []; const id = S.route.id; const sc = r.scope || {};
  if (sel === 'draft') {
    const d = r.draft; const n = vs.length + 1; const opts = d.opts || {};
    const brief = n === 1 ? `<div class="card"><div class="sec-h"><h3>Brief · ${esc((TYPES[r.type] || {}).uzun || '')}</h3></div><div class="grid2">${(BRIEF[r.type] || []).map(([k, label, ph]) => `<label class="fld"><span>${label}</span><input id="b-${k}" data-bind="brief.${k}" value="${esc((d.brief || {})[k] || '')}" placeholder="${esc(ph)}"></label>`).join('')}</div></div>` : '';
    const pins = (d.pins || []).length ? (d.pins || []).map((p, i) => `<div class="pin-row"><span class="pin-no">${i + 1}</span><textarea class="inp" id="pin-${esc(p.id)}" data-bind="pin.${esc(p.id)}" rows="2" placeholder="Bu ${p.w ? 'bölgede' : 'noktada'} ne değişecek?">${esc(p.text || '')}</textarea><button class="btn ghost" data-act="pin-del" data-id="${esc(p.id)}" aria-label="İşaret ${i + 1}'i sil">${I.x}</button></div>`).join('') : `<p class="hint">${d.image ? 'Görüntüye tıklayarak ya da sürükleyerek işaret ekle.' : 'Görüntü ekleyince üzerinde işaretleyebilirsin.'}</p>`;
    const ai = S.sample ? `<button class="btn" data-act="ai-req">${I.spark}Claude ile netleştir</button>` : '';
    return `<aside class="pcol">${brief}
      <div class="card"><div class="sec-h"><h3>${n === 1 ? 'İşaretler' : 'Revizyon · v' + n}</h3><span class="hint">${(d.pins || []).length} işaret</span></div><div class="pins">${pins}</div>
        <label class="fld"><span>Genel not</span><textarea id="d-note" data-bind="note" rows="2" placeholder="Tüm talep için geçerli bir not">${esc(d.note || '')}</textarea></label></div>
      <div class="card"><div class="sec-h"><h3>Kapsam</h3><span class="hint">Köprü gelince seçimden dolacak</span></div>
        <div class="grid2"><label class="fld"><span>Sahne</span><input id="s-scene" data-bind="scope.scene" value="${esc(sc.scene || '')}" placeholder="Cephe-Guney"></label><label class="fld"><span>Tag'ler</span><input id="s-tags" data-bind="scope.tags" value="${esc(sc.tags || '')}" placeholder="40_CEPHE"></label></div>
        <label class="fld"><span>Bileşenler</span><input id="s-comps" data-bind="scope.comps" value="${esc(sc.comps || '')}" placeholder="M-02_TvUnitesi"></label>
        <div class="btn-row"><label class="check"><input type="checkbox" id="o-std" data-bind="opt.std"${opts.std !== false ? ' checked' : ''}>Proje standartlarını ekle</label><label class="check"><input type="checkbox" id="o-tes" data-bind="opt.teslim"${opts.teslim !== false ? ' checked' : ''}>Teslim kurallarını ekle</label></div></div>
      <div class="card"><div class="sec-h"><h3>Prompt</h3><span class="hint">Canlı önizleme</span></div>
        <pre class="prompt-pre" id="prompt-pre">${esc(buildPrompt(id, d, n))}</pre>
        <div class="btn-row"><button class="btn" data-act="copy-prompt">${I.copy}Kopyala</button>${d.image ? `<button class="btn" data-act="dl-marked">${I.dl}İşaretli PNG</button>` : ''}<button class="btn" data-act="dl-md">${I.dl}.md</button>${ai}</div>
        ${aiHTML('r:' + id, 'req')}</div></aside>`;
  }
  const v = vs[sel - 1]; if (!v) return '<aside class="pcol"></aside>';
  const isLast = sel === vs.length;
  const prompt = v.prompt || buildPrompt(id, v, v.n);
  const hint = isLast && r.status === 'claudeda' ? `<p class="sendhint">Bu versiyon Claude'da. Promptu Claude'a yapıştırdıysan bekle; bitince sonucu soldaki alana yapıştır. ${v.sentAt ? 'Gönderim: ' + fmtShort(v.sentAt) + ' (' + ago(v.sentAt) + ').' : ''}</p>` : '';
  return `<aside class="pcol">${hint}
    <div class="card"><div class="sec-h"><h3>Claude ne yaptı? · v${v.n}</h3>${v.minutes != null ? `<span class="hint">Süre ${dur(v.minutes)}</span>` : ''}</div>

    ${(v.pins || []).length ? `<div class="card"><div class="sec-h"><h3>İşaretler</h3></div><ol class="steps">${v.pins.map((p) => `<li>${esc(p.text || '(not yok)')}</li>`).join('')}</ol></div>` : ''}
    <div class="card"><div class="sec-h"><h3>Gönderilen prompt</h3><span class="hint">${fmtShort(v.sentAt)}</span></div><pre class="prompt-pre">${esc(prompt)}</pre>
      <div class="btn-row"><button class="btn" data-act="copy-prompt" data-v="${v.n}">${I.copy}Kopyala</button></div></div></aside>`;
}

// ---------------- paftalar
function paftalarHTML() {
  const P = proj(); const sh = list('sheets', S.projectId).sort((a, b) => String(a.no).localeCompare(String(b.no), 'tr'));
  const cnt = {}; sh.forEach((s) => { cnt[s.status] = (cnt[s.status] || 0) + 1; });
  const strip = Object.keys(SSTAT).filter((k) => cnt[k]).map((k) => `<span><b>${cnt[k]}</b>${SSTAT[k].toLowerCase()}</span>`).join('');
  const rows = sh.map((s) => {
    const revs = s.revisions || []; const last = revs[revs.length - 1]; const open = S.ui.openSheet === s.id;
    const row = `<tr class="row${open ? ' open' : ''}" data-act="sheet-toggle" data-id="${esc(s.id)}" tabindex="0" aria-expanded="${open}"><td class="no">${esc(s.no)}</td><td>${esc(s.title)}</td><td>${SKIND[s.kind] || esc(s.kind)}</td><td class="num">${esc(s.scale === 'oto' ? 'otomatik' : s.scale)}</td><td class="num">${esc(s.size)}</td><td>${revs.length ? verTxt(revs.length) : '<span class="muted">—</span>'}</td><td><span class="pill st-${s.status}">${SSTAT[s.status] || s.status}</span></td><td class="num">${last ? fmtDate(last.date) : '—'}</td></tr>`;
    return row + (open ? `<tr class="xrow"><td colspan="8">${sheetDetail(s)}</td></tr>` : '');
  }).join('');
  return `<header class="vh"><div><p class="eyebrow">${esc(P.name)}</p><h1>Paftalar</h1></div><div class="vh-actions"><button class="btn primary" data-act="new-sheet">${I.plus}Pafta ekle</button></div></header>
  <div class="strip">${strip || '<span>Henüz pafta yok.</span>'}</div>
  ${sh.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>No</th><th>Başlık</th><th>Tür</th><th>Ölçek</th><th>Boyut</th><th>Versiyon</th><th>Durum</th><th>Son değişiklik</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="card"><p>Pafta listesi boş. Pafta ekleyince versiyon geçmişi, durum ve kime gönderildiği burada tutulur.</p></div>'}`;
}
function sheetDetail(s) {
  const revs = s.revisions || [];
  const hist = revs.length ? `<ul class="revlist">${revs.slice().reverse().map((r) => `<li>${verTxt(r.v)}<div>${esc(r.note || '')}<small>${fmtDate(r.date)}${r.sentTo ? ' · Gönderildi: ' + esc(r.sentTo) + (r.sentAt ? ', ' + fmtDate(r.sentAt) : '') : ''}</small></div></li>`).join('')}</ul>` : '<p class="hint">Henüz yayınlanmadı. İlk versiyonu yayınla.</p>';
  const links = [];
  if (s.itemId && S.data.items[s.itemId]) links.push(`<a class="btn sm" href="#imalat-${esc(s.itemId)}">İmalat paftasını aç</a>`);
  if (s.requestId && S.data.requests[s.requestId]) links.push(`<a class="btn sm" href="#talep-${esc(s.requestId)}">Talebi aç · ${esc(S.data.requests[s.requestId].code)}</a>`);
  return `<div class="xbox"><div><div class="sec-h"><h3>Versiyon geçmişi</h3></div>${hist}${links.length ? `<div class="btn-row" style="margin-top:12px">${links.join('')}</div>` : ''}</div>
    <div class="xactions">
      <label class="fld"><span>Durum</span><select id="ss-${esc(s.id)}" data-sheet-status="${esc(s.id)}">${Object.entries(SSTAT).map(([k, v]) => `<option value="${k}"${k === s.status ? ' selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="fld"><span>v${revs.length + 1} — ne değişti?</span><textarea class="inp" id="rn-${esc(s.id)}" rows="2" placeholder="Örn. kapak derzi 3 mm'ye çıkarıldı"></textarea></label>
      <div><button class="btn" data-act="sheet-rev" data-id="${esc(s.id)}">${TRI}v${revs.length + 1} yayınla</button></div>
      ${revs.length ? `<label class="fld"><span>v${revs.length} kime gönderildi?</span><span class="inline"><input class="inp" id="st-${esc(s.id)}" placeholder="Atölye, müşteri…" value="${esc(revs[revs.length - 1].sentTo || '')}"><button class="btn" data-act="sheet-sent" data-id="${esc(s.id)}">Kaydet</button></span></label>` : ''}
    </div></div>`;
}

// ---------------- imalat
function imalatHTML() {
  const P = proj(); const std = P.standards || DEFAULT_STD;
  const its = list('items', S.projectId).sort((a, b) => String(a.code).localeCompare(String(b.code), 'tr'));
  if (!its.length) return `<header class="vh"><div><p class="eyebrow">${esc(P.name)}</p><h1>İmalat</h1></div></header><div class="card"><p>Bu projede imalat objesi yok. İmalat objeleri SketchUp köprüsü kurulunca bileşenlerden otomatik gelecek: her bileşenin parçaları, ölçüleri ve konumu. Bant, damar, donanım ve notları burada tamamlarsın.</p></div>`;
  let id = S.route.id; if (!id || !S.data.items[id] || S.data.items[id].projectId !== S.projectId) id = its[0].id;
  const it = Object.assign({ id }, S.data.items[id]); const sheet = it.sheetId ? S.data.sheets[it.sheetId] : null;
  const checks = ustaChecks(it, std); const bad = checks.filter((c) => !c.ok).length;
  const ver = sheet ? (sheet.revisions || []).length : 0;
  const { svg, scale } = sheetSVG(it, P, sheet);
  const changed = (it.parts || []).filter((p) => p.changed).length;
  const left = its.map((x) => { const cb = ustaChecks(x, std).filter((c) => !c.ok).length; const sh = x.sheetId && S.data.sheets[x.sheetId]; const vv = sh ? (sh.revisions || []).length : 0; return `<a class="icard${x.id === id ? ' on' : ''}" href="#imalat-${esc(x.id)}">${itemThumb(x, std)}<span class="row1"><span class="code">${esc(x.code)}</span>${vv ? verTxt(vv) : ''}</span><b>${esc(x.name)}</b><span class="open-n${cb ? '' : ' ok'}">${cb ? cb + ' açık nokta' : 'Usta sorusu yok'}</span></a>`; }).join('');
  const sel = S.ui.partSel && (it.parts || []).find((p) => p.id === S.ui.partSel);
  const mats = matMap(std);
  const ptRows = (it.parts || []).slice().sort((a, b) => a.no - b.no).map((p) => {
    const d = partDims(p) || {}; const m = mats[p.mat]; const issues = [];
    if (!m) issues.push('malzeme'); if (!edgeDefined(p)) issues.push('bant'); if (m && m.desen && !p.grain) issues.push('damar');
    return `<tr class="row${sel && sel.id === p.id ? ' sel' : ''}" data-act="part-sel" data-id="${esc(p.id)}" tabindex="0"><td class="no">${p.no}</td><td>${esc(p.name)}${p.changed ? ' <span class="ver">•</span>' : ''}</td><td class="num">${p.qty || (p.boxes || []).length}</td><td class="num">${fmtNum(d.boy || 0)} × ${fmtNum(d.en || 0)} × ${fmtNum(d.kal || 0)}</td><td>${m ? esc(m.ad) : '<span class="warnmark">tanımsız</span>'}</td><td>${issues.length ? `<span class="warnmark">! ${issues.join(', ')}</span>` : '<span class="muted">tamam</span>'}</td></tr>`;
  }).join('');
  const ai = S.sample ? `<button class="btn" data-act="ai-usta">${I.spark}Claude'a sor: usta ne sorar?</button>` : '';
  return `<header class="vh"><div><p class="eyebrow">${esc(P.name)}</p><h1>İmalat paftaları</h1></div></header>
  <div class="igrid">
    <aside class="ilist" aria-label="İmalat objeleri">${left}</aside>
    <section class="scol">
      <div class="sbar"><div class="sbar-t"><span class="code">${esc(sheet ? sheet.no : 'Paftasız')}</span><h2>${esc(it.code)} · ${esc(it.name)}</h2>${ver ? verTxt(ver) : ''}${sheet ? `<span class="pill st-${sheet.status}">${SSTAT[sheet.status]}</span>` : ''}<span class="hint">Ölçek 1/${scale || '—'} · A3</span></div>

async function copyText(txt, okMsg) {

async function offerDownload(filename, data) {

function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('img')); im.src = src; }); }
async function markedBlob(ref, pins) {
  const im = await loadImg(imgSrc(ref));
  const W = 1600, H = 1000; const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#2b312f'; g.fillRect(0, 0, W, H);
  const s = Math.min(W / im.naturalWidth, H / im.naturalHeight); const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
  g.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
  (pins || []).forEach((p, i) => {
    if (p.w > 0) { g.setLineDash([14, 9]); g.lineWidth = 5; g.strokeStyle = '#d7261e'; g.fillStyle = 'rgba(215,38,30,.10)'; g.fillRect(p.x * W, p.y * H, p.w * W, p.h * H); g.strokeRect(p.x * W, p.y * H, p.w * W, p.h * H); g.setLineDash([]); }
    const x = p.x * W, y = p.y * H; g.beginPath(); g.arc(x, y, 22, 0, Math.PI * 2); g.fillStyle = '#d7261e'; g.fill(); g.lineWidth = 4; g.strokeStyle = '#fff'; g.stroke();
    g.fillStyle = '#fff'; g.font = 'bold 24px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(i + 1), x, y + 1);
  });
  return new Promise((res) => c.toBlob(res, 'image/png'));
}
function uploadErr(e) {
  const c = e && e.code;
  if (c === 'too_large') return 'Görüntü 20 MB sınırını aşıyor. Daha küçük bir görüntü al.';
  if (c === 'unsupported_type') return 'Bu dosya türü desteklenmiyor. PNG, JPG ya da WebP kullan.';
  if (c === 'quota_or_state') return 'Dosya alanı dolu. Kullanılmayan görüntüleri silip tekrar dene.';
  return 'Görüntü yüklenemedi (' + (c || 'hata') + ').';
}
async function handleImageFile(file, target) {
  if (!file || !/^image\//.test(file.type || '')) { toast('Bir görüntü dosyası seç (PNG, JPG, WebP).'); return; }
  if (!S.assets) { toast('Görüntü yüklemek için bu sayfayı düzenleme yetkisiyle açman gerekir.'); return; }
  const id = S.route.id; const r = S.data.requests[id]; if (!r) return;
  toast('Görüntü yükleniyor…', true);
  try {
    const type = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'].includes(file.type) ? file.type : 'image/png';
    const res = await S.assets.upload(file, { type });
    const cur = S.data.requests[id];
    if (target === 'draft' && cur.draft) { patchDoc('requests', id, { draft: { image: res.id }, updatedAt: nowISO() }); toast('Görüntü eklendi. Üzerine tıklayarak işaretle.'); }
    else if (target === 'result') {
      const vs = clone(cur.versions || []); const v = vs[vs.length - 1]; if (!v) return;

  else if (b.startsWith('scope.')) patchReq({ scope: { [b.slice(6)]: val } }, 700);
  else if (b.startsWith('opt.')) patchReq({ draft: { opts: { [b.slice(4)]: val } } }, 0);
  else if (b.startsWith('summary.')) { const n = +b.slice(8); const vs = clone(r.versions || []); if (vs[n - 1]) { vs[n - 1].summary = val; patchReq({ versions: vs }, 800); } return; }
  updatePromptPreview();
}
function onStd(el) {
  const path = el.dataset.std.split('.'); const patch = {}; let cur = patch;
  path.forEach((k, i) => { if (i === path.length - 1) cur[k] = el.value; else { cur[k] = {}; cur = cur[k]; } });
  patchDoc('projects', S.projectId, { standards: patch }, 700);
}
function onMat(el) {
  const [i, f] = el.dataset.mat.split('.'); const P = proj(); const m = clone((P.standards || DEFAULT_STD).malzemeler || []); if (!m[+i]) return;
  m[+i][f] = el.type === 'checkbox' ? el.checked : f === 'kalinlik' ? (parseFloat(el.value) || 0) : el.value;
  patchDoc('projects', S.projectId, { standards: { malzemeler: m } }, 700);
}

// yapıştır, sürükle-bırak
document.addEventListener('paste', (e) => {
  if (S.route.view !== 'talep') return;
  const item = [...((e.clipboardData && e.clipboardData.items) || [])].find((i) => i.type && i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault(); const f = item.getAsFile(); const r = R(); if (!r) return;
  if (r.draft) handleImageFile(f, 'draft'); else if (r.status === 'claudeda') handleImageFile(f, 'result'); else toast('Önce "Revizyon iste" ile yeni bir taslak aç.');
});
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleImageFile(f, z.dataset.drop); });

// işaretleme
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const st = e.target.closest && e.target.closest('[data-draw]'); if (!st || e.button !== 0 || e.target.closest('.mk-badge')) return;
  const rc = st.getBoundingClientRect(); const fx = clamp01((e.clientX - rc.left) / rc.width), fy = clamp01((e.clientY - rc.top) / rc.height);
  drag = { st, rc, x0: fx, y0: fy, x1: fx, y1: fy, id: e.pointerId, el: null };
  try { st.setPointerCapture(e.pointerId); } catch (er) { /* yok */ }
  e.preventDefault();
});
document.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x1 = clamp01((e.clientX - drag.rc.left) / drag.rc.width); drag.y1 = clamp01((e.clientY - drag.rc.top) / drag.rc.height);
  const w = Math.abs(drag.x1 - drag.x0), h = Math.abs(drag.y1 - drag.y0);
  if (w > 0.012 || h > 0.012) {
    if (!drag.el) { drag.el = document.createElement('div'); drag.el.className = 'mk-temp'; drag.st.appendChild(drag.el); }
    Object.assign(drag.el.style, { left: Math.min(drag.x0, drag.x1) * 100 + '%', top: Math.min(drag.y0, drag.y1) * 100 + '%', width: w * 100 + '%', height: h * 100 + '%' });
  }
});
function endDrag(e, cancel) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null; if (d.el) d.el.remove(); if (cancel) return;
  const w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);
  const pin = w > 0.015 || h > 0.015 ? { x: MM(Math.min(d.x0, d.x1) * 1e4) / 1e4, y: MM(Math.min(d.y0, d.y1) * 1e4) / 1e4, w: MM(w * 1e4) / 1e4, h: MM(h * 1e4) / 1e4 } : { x: MM(d.x0 * 1e4) / 1e4, y: MM(d.y0 * 1e4) / 1e4, w: 0, h: 0 };
  pin.id = rid('k'); pin.text = '';
  const r = R(); if (!r || !r.draft) return;
  patchReq({ draft: { pins: [...clone(r.draft.pins || []), pin] } });
  render();
  const t = document.getElementById('pin-' + pin.id); if (t) { t.focus(); t.scrollIntoView({ block: 'nearest' }); }
}
document.addEventListener('pointerup', (e) => endDrag(e, false));
document.addEventListener('pointercancel', (e) => endDrag(e, true));

// =====================================================================
// başlat
// =====================================================================
S.route = parseHash();
render();
if (!window.claude || !window.claude.use) { S.dbState = 'none'; render(); }
else {
  const slow = setTimeout(() => { if (S.dbState === 'loading') { S.dbState = 'slow'; render(); } }, 10000);
  window.claude.use('db').then((db) => {
    if (!db) { clearTimeout(slow); S.dbState = 'none'; render(); return; }
    S.db = db; subscribe();
    const iv = setInterval(() => { if (COLS.every((c) => S.loaded[c])) { clearTimeout(slow); clearInterval(iv); } }, 500);
  }, () => { S.dbState = 'none'; render(); });
  window.claude.use('assets').then((a) => { S.assets = a; }, () => {});
  window.claude.use('sample').then((s) => { S.sample = s; scheduleRender(); }, () => {});
  window.claude.use('downloads').then((d) => { S.downloads = d; }, () => {});
}
})();
</script>
