<title>Pafta Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  /* Layout: macOS düzeni — solda kenar çubuğu, ortada içerik, sağda düzenleme paneli; kenarlıksız yüzeyler, tek vurgu rengi, sistem yazı tipi */
  --bg: #FFFFFF;
  --side: #F5F5F7;
  --fill: #F0F0F3;
  --fill-2: #E5E5EA;
  --knob: #FFFFFF;
  --label: #1D1D1F;
  --label-2: #6E6E73;
  --accent: #0071E3;
  --accent-tint: #E8F1FC;
  --on-accent: #FFFFFF;
  --red: #FF3B30;
  --orange: #FF9500;
  --green: #34C759;
  --paper: #FFFFFF;
  --ring: rgba(0, 113, 227, .42);
  --scrim: rgba(0, 0, 0, .3);
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161617; --side: #1E1E20; --fill: #232326; --fill-2: #303034; --knob: #5C5C61;
    --label: #F5F5F7; --label-2: #98989D; --accent: #2997FF; --accent-tint: #14273D; --on-accent: #FFFFFF;
    --red: #FF453A; --orange: #FF9F0A; --green: #30D158; --paper: #FFFFFF;
    --ring: rgba(41, 151, 255, .5); --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161617; --side: #1E1E20; --fill: #232326; --fill-2: #303034; --knob: #5C5C61;
  --label: #F5F5F7; --label-2: #98989D; --accent: #2997FF; --accent-tint: #14273D; --on-accent: #FFFFFF;
  --red: #FF453A; --orange: #FF9F0A; --green: #30D158; --paper: #FFFFFF;
  --ring: rgba(41, 151, 255, .5); --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--label); font: 15px/1.47 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 1px; }
.ic { flex: none; display: block; }
.hint { font-size: 13px; color: var(--label-2); }

/* kabuk */
.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: auto; background: var(--side); display: flex; flex-direction: column; gap: 22px;
  padding-block: 20px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px;
}
.app-name { font-size: 13px; font-weight: 600; color: var(--label-2); padding: 0 10px; }
.projsel { position: relative; padding: 0 10px; }
.projsel .pname { display: block; padding-right: 22px; font: 700 17px/1.3 var(--font-d); color: var(--label); }
.projsel select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.projsel:focus-within { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
.projsel .ic { position: absolute; right: 10px; top: 3px; color: var(--label-2); pointer-events: none; }
.projsel p { font-size: 13px; color: var(--label-2); margin-top: 2px; }
.nav { display: grid; gap: 1px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--label); text-decoration: none; font-size: 14px; }
.nav a .ic { color: var(--accent); }
.nav a:hover { background: var(--fill); }
.nav a.on { background: var(--fill-2); font-weight: 600; }
.nav .n { margin-left: auto; font-size: 13px; color: var(--label-2); font-weight: 400; font-variant-numeric: tabular-nums; }
.rail-foot { margin-top: auto; padding: 0 10px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--label-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--label-2); flex: none; }
.main { min-width: 0; padding-block: 30px 72px; padding-left: 44px; padding-right: max(44px, env(safe-area-inset-right, 0px)); }
.mhead, .tabbar { display: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mhead { display: block; padding-block: 14px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mhead .projsel { padding: 0; }
  .mhead .projsel .ic { right: 0; }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(100px + env(safe-area-inset-bottom, 0px)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    background: var(--side); background: color-mix(in srgb, var(--side) 84%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  .tabbar a { display: grid; justify-items: center; gap: 3px; padding: 4px 0; font-size: 10.5px; color: var(--label-2); text-decoration: none; }
  .tabbar a.on { color: var(--accent); }
}

/* başlık, düğmeler, segment */
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 26px; }
.head h1 { font: 700 34px/1.12 var(--font-d); }
.head .sub { margin-top: 4px; font-size: 15px; color: var(--label-2); }
.actions, .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--fill-2); color: var(--label); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { filter: brightness(.97); }
.btn:disabled { opacity: .4; cursor: default; filter: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.red { background: var(--red); color: var(--on-accent); }
.btn.plain { background: transparent; color: var(--accent); padding: 0 4px; height: auto; }
.btn.plain:hover { filter: none; text-decoration: underline; }
.btn.destructive { background: transparent; color: var(--red); padding: 0 4px; height: auto; }
.back { display: inline-flex; align-items: center; gap: 2px; margin: 0 0 12px -6px; color: var(--accent); text-decoration: none; font-size: 15px; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--fill-2); max-width: 100%; overflow-x: auto; scrollbar-width: none; vertical-align: middle; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 0; background: transparent; color: var(--label); font-size: 13px; font-weight: 500; line-height: 1; padding: 7px 14px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--knob); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 0 1px rgba(0, 0, 0, .1); }
.st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--label-2); flex: none; }
.st.claudeda::before, .st.gonderildi::before { background: var(--accent); }
.st.kontrol::before { background: var(--orange); }
.st.onay::before { background: var(--green); }
.st.revizyon::before { background: var(--red); }

/* talepler */
.sect { margin-top: 36px; }
.sect-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
.sect-h h2 { font: 600 22px/1.2 var(--font-d); }
.sect-h span { color: var(--label-2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 28px 22px; }
.tile { display: grid; gap: 10px; align-content: start; color: var(--label); text-decoration: none; }
.tile .img { aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background: var(--fill); display: grid; place-items: center; color: var(--label-2); }
.tile .img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
.tile:hover .img img { transform: scale(1.025); }
.tile h3 { font-size: 15px; line-height: 1.3; }
.tile p { margin-top: 2px; font-size: 13px; color: var(--label-2); }

/* talep detayı */
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
@media (max-width: 1120px) { .dgrid { grid-template-columns: minmax(0, 1fr); } }
.ccol { display: grid; gap: 12px; min-width: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stage, .compare, .drop { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--fill); }
.stage { user-select: none; -webkit-user-select: none; }
.stage > img, .compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.stage[data-draw] { cursor: crosshair; touch-action: none; }
.marks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mk-rect { fill: none; stroke: var(--red); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.mk-badge, .pin-no { width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; background: var(--red); color: #fff; font-size: 13px; font-weight: 600; line-height: 26px; text-align: center; }
.mk-badge { position: absolute; transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0, 0, 0, .3); }
.mk-temp { position: absolute; border: 2.5px solid var(--red); border-radius: 2px; pointer-events: none; }
.cmp-b { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos, 50%)) 0 0); }
.cmp-line { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
.cmp-knob { position: absolute; top: 50%; left: var(--pos, 50%); width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #fff; color: #1d1d1f; display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0, 0, 0, .3); pointer-events: none; }
.cmp-lbl { position: absolute; top: 12px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; background: rgba(0, 0, 0, .5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: none; }
.cmp-lbl.l { left: 12px; } .cmp-lbl.r { right: 12px; }
.cmp-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.compare:focus-within { outline: 3px solid var(--ring); outline-offset: 2px; }
.drop { display: grid; place-items: center; text-align: center; padding: 24px; aspect-ratio: 16 / 10; }
.drop.slim { aspect-ratio: auto; padding: 28px 24px; }
.drop.over { background: var(--accent-tint); }
.drop .ic { margin: 0 auto; color: var(--accent); }
.drop b { display: block; margin: 12px 0 4px; font: 600 17px/1.3 var(--font-d); }
.drop p { max-width: 46ch; margin: 0 auto 14px; color: var(--label-2); }

/* düzenleme paneli */
.insp { background: var(--side); border-radius: 16px; padding: 20px; display: grid; gap: 26px; align-content: start; min-width: 0; }
.grp { display: grid; gap: 10px; min-width: 0; }
.grp > h3 { font-size: 15px; line-height: 1.3; }
.grp > h3 small { margin-left: 6px; font-size: 13px; font-weight: 400; color: var(--label-2); }
.fld { display: grid; gap: 5px; min-width: 0; }
.fld > span { font-size: 13px; color: var(--label-2); }
.input { width: 100%; border: 0; border-radius: 8px; background: var(--fill); color: var(--label); padding: 8px 10px; font-size: 15px; line-height: 1.35; }
.insp .input { background: var(--bg); }
textarea.input { resize: vertical; min-height: 64px; }
.input::placeholder { color: var(--label-2); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pins { display: grid; gap: 10px; }
.pin-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 24px; gap: 10px; align-items: start; }
.pin-row .pin-no { margin-top: 6px; }
.pin-row textarea { min-height: 44px; }
.pin-ro { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
.pin-ro p { padding-top: 3px; }
.icon-btn { width: 24px; height: 24px; margin-top: 7px; border: 0; border-radius: 6px; background: transparent; color: var(--label-2); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: var(--fill-2); }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; cursor: pointer; }
.switch { appearance: none; -webkit-appearance: none; flex: none; margin: 0; width: 40px; height: 24px; border-radius: 12px; background: var(--fill-2); position: relative; cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch:checked { background: var(--green); }
.switch:checked::after { transform: translateX(16px); }
.prompt { margin: 0; background: var(--bg); border-radius: 10px; padding: 12px 14px; font: 13px/1.55 var(--font); color: var(--label); white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
.note { font-size: 14px; color: var(--label-2); }
.ai { display: grid; gap: 14px; }
.ai-it { display: grid; gap: 3px; }
.ai-it b { font-size: 14px; font-weight: 600; }
.ai-it p { font-size: 13px; color: var(--label-2); }
.ai-it .btn { justify-self: start; margin-top: 2px; }
.thinking { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--label-2); }
.spin { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid var(--fill-2); border-top-color: var(--label-2); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* listeler */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
@media (max-width: 1120px) { .split { grid-template-columns: minmax(0, 1fr); } }
.scroll-x { overflow-x: auto; min-width: 0; }
.list { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.list th { text-align: left; padding: 0 12px 8px; font-size: 12px; font-weight: 600; color: var(--label-2); white-space: nowrap; }
.list td { padding: 11px 12px; white-space: nowrap; vertical-align: middle; }
.list td.wrap { white-space: normal; min-width: 160px; }
.list td.muted { color: var(--label-2); }
.list tr.row { cursor: pointer; }
.list tr.row:hover td { background: var(--fill); }
.list tr.sel td, .list tr.sel:hover td { background: var(--fill-2); }
.list td:first-child { border-radius: 8px 0 0 8px; }
.list td:last-child { border-radius: 0 8px 8px 0; }
.hist { display: grid; gap: 14px; }
.hist b { font-weight: 600; margin-right: 6px; }
.hist p { font-size: 14px; }
.hist .hint { display: block; }

/* imalat */
.igrid { display: grid; grid-template-columns: 228px minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
@media (max-width: 1480px) { .igrid { grid-template-columns: minmax(0, 1fr) 320px; } .igrid > .items { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; } .igrid > .items a { flex: 0 0 236px; } }
@media (max-width: 1100px) { .igrid { grid-template-columns: minmax(0, 1fr); } }
.items { display: grid; gap: 2px; }
.items a { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border-radius: 10px; color: var(--label); text-decoration: none; }
.items a:hover { background: var(--fill); }
.items a.on { background: var(--fill-2); }
.items svg.thumb { width: 64px; height: 40px; }
.items b { display: block; font-size: 14px; font-weight: 600; line-height: 1.25; }
.items small { font-size: 12px; color: var(--label-2); }
.scol { display: grid; gap: 16px; min-width: 0; }
.scol h2 { font: 600 22px/1.2 var(--font-d); }
.canvas { background: var(--fill); border-radius: 16px; padding: 24px; overflow: auto; }
.canvas svg { display: block; width: 100%; height: auto; background: var(--paper); border-radius: 2px; box-shadow: var(--shadow); }
.canvas.zoom svg { width: 230%; max-width: none; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 230px; padding: 5px; display: grid; background: var(--bg); border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .18), 0 0 1px rgba(0, 0, 0, .3); }
.menu button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 14px; color: var(--label); cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--accent); color: var(--on-accent); outline: 0; }
.summary { display: flex; gap: 12px; align-items: center; }
.summary .big { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; background: var(--green); }
.summary .big.warn { background: var(--orange); }
.summary b { display: block; font: 600 17px/1.25 var(--font-d); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.checks i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; margin-top: 1px; background: var(--green); }
.checks .bad i { background: var(--orange); }
.checks small { display: block; font-size: 13px; color: var(--label-2); }
.edges { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; justify-items: center; }
.edges .face { grid-column: 2; grid-row: 2; width: 100%; height: 60px; border-radius: 6px; background: var(--fill-2); display: grid; place-items: center; font-size: 12px; color: var(--label-2); }
.edges .e-u1 { grid-column: 2; grid-row: 1; } .edges .e-u2 { grid-column: 2; grid-row: 3; }
.edges .e-k1 { grid-column: 1; grid-row: 2; } .edges .e-k2 { grid-column: 3; grid-row: 2; }
.eb { border: 0; border-radius: 999px; padding: 5px 10px; min-width: 62px; background: var(--bg); color: var(--label); font-size: 12px; font-weight: 500; cursor: pointer; }
.eb.on { background: var(--label); color: var(--bg); }
.eb.undef { color: var(--orange); box-shadow: inset 0 0 0 1.5px var(--orange); }

/* standartlar, köprü */
.form { max-width: 760px; display: grid; gap: 44px; }
.form section { display: grid; gap: 14px; }
.form h2, .page h2 { font: 600 22px/1.2 var(--font-d); }
.desc { margin-top: -6px; font-size: 14px; color: var(--label-2); max-width: 62ch; }
.mats { display: grid; gap: 10px; }
.mat { display: grid; grid-template-columns: 30px minmax(0, 2fr) 74px minmax(0, 1.4fr) auto 24px; gap: 10px; align-items: center; }
.mat-h { font-size: 12px; font-weight: 600; color: var(--label-2); }
.mat .des { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--label-2); }
.mat .icon-btn { margin: 0; }
.swatch { appearance: none; -webkit-appearance: none; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.swatch::-webkit-color-swatch-wrapper { padding: 0; }
.swatch::-webkit-color-swatch { border: 0; border-radius: 50%; }
.swatch::-moz-color-swatch { border: 0; border-radius: 50%; }
@media (max-width: 640px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .mat { grid-template-columns: 30px minmax(0, 1fr) 64px 24px; }
  .mat .kod { grid-column: 2 / span 2; grid-row: 2; }
  .mat .des { grid-column: 2 / span 2; grid-row: 3; }
  .mat-h { display: none; }
}
.page { max-width: 720px; display: grid; gap: 48px; }
.lead { font-size: 17px; color: var(--label-2); max-width: 58ch; }
.feats { display: grid; gap: 22px; margin-top: 18px; }
.feat { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
.feat .ic { color: var(--accent); }
.feat b { display: block; font-weight: 600; }
.feat b span { margin-left: 8px; font-size: 13px; font-weight: 500; color: var(--accent); }

  if (q.busy || !S.db) return;
  const ref = S.db.doc(q.col + '/' + q.id);

  if (q.del) { q.del = false; op = () => ref.delete(); }
  else if (q.set) { const d = q.set; q.set = null; op = () => ref.set(d); }
  else if (q.patch) { const p = q.patch; q.patch = null; op = () => ref.update(p); }

function locSuffix(n) {
  const U = ["'da", "'de", "'de", "'te", "'te", "'te", "'da", "'de", "'de", "'da"], TENS = ["'de", "'da", "'de", "'da", "'ta", "'de", "'ta", "'te", "'de", "'da"];
  n = Math.abs(n); if (n % 100 === 0 && n) return "'de";
  return n % 10 ? U[n % 10] : TENS[Math.floor(n / 10) % 10];
}
function where(p) {
  const cx = p.x + (p.w || 0) / 2, cy = p.y + (p.h || 0) / 2;
  const h = cx < 0.34 ? 'sol' : cx > 0.66 ? 'sağ' : 'orta', v = cy < 0.34 ? 'üst' : cy > 0.66 ? 'alt' : 'orta';
  if (h === 'orta' && v === 'orta') return 'orta';
  if (h === 'orta') return v + ' orta';
  if (v === 'orta') return h + ' orta';
  return h + ' ' + v;
}
function buildPrompt(id, d, n) {
  const r = S.data.requests[id]; if (!r) return '';
  const P = S.data.projects[r.projectId] || {}; const std = P.standards || DEFAULT_STD;
  const sc = r.scope || {}; const o = [];
  o.push(`# ${r.code} · ${r.title} — v${n}`);
  o.push(`Proje: ${P.name || '—'}${P.code ? ' (' + P.code + ')' : ''} · Tür: ${(TYPES[r.type] || {}).uzun || r.type}`);
  o.push(`Kapsam: sahne ${sc.scene ? '"' + sc.scene + '"' : '—'} · tag ${sc.tags || '—'} · bileşen ${sc.comps || '—'}`);
  o.push('');

    o.push('## Talep');
    const br = d.brief || {};
    (BRIEF[r.type] || []).forEach(([k, label]) => { if (String(br[k] || '').trim()) o.push(`- ${label}: ${String(br[k]).trim()}`); });
  } else {
    const prev = (r.versions || [])[n - 2];
    o.push(`## Revizyon — v${n - 1} üzerine`);
    if (prev && prev.summary) o.push(`v${n - 1}${locSuffix(n - 1)} yapılan: ${prev.summary}`);
  }
  if (String(d.note || '').trim()) { o.push(''); o.push(String(d.note).trim()); }
  const pins = d.pins || [];

    o.push(''); o.push('## İşaretli noktalar');

  }
  const opts = d.opts || {};
  o.push(''); o.push('## Çalışma kuralları');
  if (opts.std !== false) {
    lines(std.claudeKurallari).forEach((l) => o.push('- ' + l));
    const tags = lines(std.tagYapisi); if (tags.length) o.push('- Tag yapısı: ' + tags.join(', '));
    if (std.isimlendirme) o.push('- İsimlendirme: ' + std.isimlendirme);
  }
  o.push('- Kapsam dışındaki geometriye dokunma.');
  if (opts.teslim !== false) {
    o.push(''); o.push('## Teslim');
    lines(std.teslimKurallari).forEach((l) => o.push('- ' + l));
    o.push(`- Bitince ${sc.scene ? '"' + sc.scene + '" sahnesinden' : 'aynı açıdan'} ekran görüntüsü al: ${r.code}_v${n}.png`);
    o.push('- Yaptığın değişiklikleri madde madde özetle; değişen bileşenlerin adlarını yaz.');
  }
  return o.join('\n');
}
function canSend(r) {

  const im = await loadImg(imgSrc(ref));
  const W = 1600, H = 1000; const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#2b312f'; g.fillRect(0, 0, W, H);
  const s = Math.min(W / im.naturalWidth, H / im.naturalHeight); const dw = im.naturalWidth * s, dh = im.naturalHeight * s;

    g.fillStyle = '#fff'; g.font = 'bold 24px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(i + 1), x, y + 1);

}

    const brief = {}; document.querySelectorAll('[data-nb]').forEach((i) => { if (i.value.trim()) brief[i.dataset.nb] = i.value.trim(); });
    const id = rid('t'); const now = nowISO();
    createDoc('requests', id, { projectId: S.projectId, code: nextCode('T-', 'requests'), title, type, status: 'taslak', createdAt: now, updatedAt: now, scope: { scene: $('#nr-scene').value.trim(), tags: $('#nr-tags').value.trim(), comps: '' }, versions: [], draft: { image: null, pins: [], note: '', brief, opts: { std: true, teslim: true } } });
    closeModal(); go('talep-' + id);
  },
  'create-project': () => {
    const name = $('#np-name').value.trim(); if (!name) { $('#np-name').focus(); toast('Projeye bir ad ver.'); return; }
    const id = rid('p'); createDoc('projects', id, { name, code: $('#np-code').value.trim(), location: $('#np-loc').value.trim(), client: $('#np-client').value.trim(), createdAt: nowISO(), standards: clone(DEFAULT_STD) });
    S.projectId = id; lsSet('pm.project', id); closeModal(); go('talepler');
  },
  'create-sheet': () => {
    const no = $('#ns-no').value.trim(); const title = $('#ns-title').value.trim(); if (!no || !title) { toast('Pafta no ve başlık gerekli.'); return; }
    const itemSel = $('#ns-item'); const itemId = itemSel ? itemSel.value : '';
    const id = rid('s'); createDoc('sheets', id, { projectId: S.projectId, no, title, kind: $('#ns-kind').value, scale: $('#ns-scale').value.trim() || '—', size: $('#ns-size').value.trim() || 'A3', status: 'hazirlaniyor', revisions: [], itemId: itemId || null });
    if (itemId && S.data.items[itemId] && !S.data.items[itemId].sheetId) patchDoc('items', itemId, { sheetId: id });
    closeModal(); S.ui.openSheet = id; render();
  },
  vsel: (el) => { S.ui.sel = el.dataset.v === 'draft' ? 'draft' : +el.dataset.v; S.ui.tab = null; render(); },
  tab: (el) => { S.ui.tab = el.dataset.v; render(); },
  'pick-image': (el) => { S.ui.fileTarget = el.dataset.target; const f = $('#file-in'); f.value = ''; f.click(); },
  'pin-focus': (el) => { const t = document.getElementById('pin-' + el.dataset.id); if (t) { t.focus(); t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } },
  'pin-del': (el) => { const r = R(); patchReq({ draft: { pins: (r.draft.pins || []).filter((p) => p.id !== el.dataset.id) } }); render(); },
  'pins-clear': () => { patchReq({ draft: { pins: [] } }); render(); },
  'copy-prompt': (el) => { const r = R(); const v = el.dataset.v ? r.versions[+el.dataset.v - 1] : null; const txt = v ? (v.prompt || buildPrompt(S.route.id, v, v.n)) : buildPrompt(S.route.id, r.draft, (r.versions || []).length + 1); copyText(txt, 'Prompt panoya kopyalandı.'); },
  'dl-md': () => { const r = R(); const n = (r.versions || []).length + 1; offerDownload(`${r.code}_v${n}_prompt.md`, buildPrompt(S.route.id, r.draft, n)); },
  'dl-marked': async () => { const r = R(); try { const b = await markedBlob(r.draft.image, r.draft.pins); offerDownload(`${r.code}_v${(r.versions || []).length + 1}_isaretli.png`, b); } catch (e) { toast('İşaretli görüntü hazırlanamadı.'); } },
  send: () => {
    const id = S.route.id; const r = R(); if (!r || !r.draft || !canSend(r)) return;
    const n = (r.versions || []).length + 1; const d = r.draft; const prompt = buildPrompt(id, d, n);
    const v = { n, sentAt: nowISO(), doneAt: null, minutes: null, image: d.image || null, result: null, pins: clone(d.pins || []), note: d.note || '', opts: clone(d.opts || {}), prompt, summary: '' };
    if (n === 1) v.brief = clone(d.brief || {});
    patchReq({ versions: [...clone(r.versions || []), v], draft: null, status: 'claudeda' });
    S.ui.sel = n; S.ui.tab = null;
    navigator.clipboard.writeText(prompt).then(() => toast(`v${n} gönderildi; prompt panoya kopyalandı. Claude'a yapıştır${d.image ? ', işaretli PNG\'yi de ekle' : ''}.`), () => toast(`v${n} gönderildi. Promptu sağdan kopyalayıp Claude'a ver.`));
    render();
  },
  unsend: () => {
    const r = R(); const vs = clone(r.versions || []); const v = vs.pop(); if (!v) return;
    patchReq({ versions: vs, status: 'taslak', draft: { image: v.image || null, pins: v.pins || [], note: v.note || '', brief: v.brief || {}, opts: v.opts || { std: true, teslim: true } } });
    S.ui.sel = 'draft'; render(); toast(`v${v.n} taslağa geri alındı.`);
  },
  approve: () => { const r = R(); const vs = clone(r.versions || []); if (vs.length) vs[vs.length - 1].approved = true; patchReq({ status: 'onay', approvedAt: nowISO(), versions: vs }); render(); toast('Onaylandı.'); },
  revise: () => {
    const r = R(); const vs = r.versions || []; const last = vs[vs.length - 1];
    patchReq({ status: 'taslak', draft: { image: last ? (last.result || last.image || null) : null, pins: [], note: '', brief: {}, opts: { std: true, teslim: true } } });
    S.ui.sel = 'draft'; render(); toast(`v${vs.length + 1} taslağı açıldı. Görüntü üzerinde işaretle.`);
  },
  'req-del': () => { const r = R(); confirmModal(`${r.code} silinsin mi?`, 'Talep ve tüm versiyonları silinir. Yüklenen görüntüler dosya alanında kalır.', 'Sil', () => { deleteDoc('requests', S.route.id); go('talepler'); toast('Talep silindi.'); }); },
  'ai-req': aiRequest,
  'ai-usta': aiItem,
  'ai-stop': (el) => { const a = S.ui.ai[el.dataset.k]; if (a && a.ctl) a.ctl.abort(); },
  'ai-add': (el) => {
    const key = el.dataset.k; const a = S.ui.ai[key]; const i = +el.dataset.i; const x = a && a.list[i]; if (!x) return;
    if (key.startsWith('r:')) { const r = R(); const note = String((r.draft && r.draft.note) || '').trim(); patchReq({ draft: { note: (note ? note + '\n' : '') + '- ' + x.oneri } }); }
    else { const id = key.slice(2); const it = S.data.items[id]; patchDoc('items', id, { notes: [...(it.notes || []), x.not] }); }
    a.added[i] = true; render();
  },
  'sheet-sel': (el) => { S.ui.openSheet = S.ui.openSheet === el.dataset.id ? null : el.dataset.id; render(); },
  'sheet-rev': (el) => {
    const id = el.dataset.id; const s = S.data.sheets[id]; const ta = document.getElementById('rn-' + id); const note = ta ? ta.value.trim() : '';
    if (!note) { if (ta) ta.focus(); toast('Bu versiyonda ne değiştiğini yaz; usta ve müşteri farkı buradan görür.'); return; }
    const revs = [...clone(s.revisions || []), { v: (s.revisions || []).length + 1, date: nowISO(), note }];
    patchDoc('sheets', id, { revisions: revs, status: 'kontrol' }); render(); toast(`${s.no} v${revs.length} yayınlandı.`);
  },
  'sheet-sent': (el) => {
    const id = el.dataset.id; const s = S.data.sheets[id]; const to = (document.getElementById('st-' + id) || {}).value || '';
    const revs = clone(s.revisions || []); if (!revs.length) return; revs[revs.length - 1].sentTo = to.trim(); revs[revs.length - 1].sentAt = nowISO();
    patchDoc('sheets', id, { revisions: revs, status: to.trim() ? 'gonderildi' : s.status }); render(); toast(to.trim() ? `v${revs.length} → ${to.trim()} olarak kaydedildi.` : 'Kaydedildi.');
  },
  'part-sel': (el) => { S.ui.partSel = S.ui.partSel === el.dataset.id ? null : el.dataset.id; render(); },
  'part-close': () => { S.ui.partSel = null; render(); },
  edge: (el) => { const k = el.dataset.k; patchPart(S.ui.partSel, (p) => { p.edges = Object.assign({}, p.edges || {}); const v = p.edges[k]; p.edges[k] = typeof v !== 'string' ? '' : v === '' ? '0.8' : v === '0.8' ? '2' : ''; }); render(); },
  zoom: () => { S.ui.zoom = !S.ui.zoom; render(); },
  menu: (el) => { S.ui.menu = !S.ui.menu; const w = el.closest('.menu-wrap'); const m = w.querySelector('.menu'); if (m) m.remove(); if (S.ui.menu) w.insertAdjacentHTML('beforeend', EXPORT_MENU); el.setAttribute('aria-expanded', String(S.ui.menu)); },
  'show-done': () => { S.ui.showDone = !S.ui.showDone; render(); },
  grain: (el) => { patchPart(S.ui.partSel, (p) => { p.grain = el.dataset.v; }); render(); },
  'std-olcu': (el) => { patchDoc('projects', S.projectId, { standards: { olcuTipi: el.dataset.v } }); render(); },
  'nr-type': (el) => { S.ui.nrType = el.dataset.v; document.querySelectorAll('#nr-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.ui.nrType))); const box = $('#nr-brief'); if (box) box.innerHTML = briefFields(S.ui.nrType); },
  svg: () => { const id = curItemId(); const it = Object.assign({ id }, S.data.items[id]); const sh = S.data.sheets[it.sheetId]; const { svg } = sheetSVG(it, proj(), sh); offerDownload(`${sh.no}_${it.code}_v${(sh.revisions || []).length}.svg`.replace(/\s+/g, '_'), '<?xml version="1.0" encoding="UTF-8"?>\n' + svg); },
  pdf: exportPDF,
  csv: () => { const id = curItemId(); const it = S.data.items[id]; offerDownload(`${it.code}_kesim_listesi.csv`, cutlistCSV(it, proj().standards || DEFAULT_STD)); },
  'make-sheet': () => { const id = curItemId(); const it = S.data.items[id]; const sid = rid('s'); createDoc('sheets', sid, { projectId: S.projectId, no: nextCode('İM-', 'sheets', 'no').replace('İM-', 'İM-'), title: it.code + ' ' + it.name, kind: 'imalat', scale: 'oto', size: 'A3', status: 'hazirlaniyor', revisions: [], itemId: id }); patchDoc('items', id, { sheetId: sid }); render(); },
  'item-publish': () => {
    const id = curItemId(); const it = S.data.items[id]; const sh = S.data.sheets[it.sheetId]; const note = ($('#pub-note') || {}).value || '';
    if (!note.trim()) { const t = $('#pub-note'); if (t) t.focus(); toast('Bu versiyonda ne değiştiğini yaz.'); return; }
    const v = (sh.revisions || []).length + 1;
    const parts = clone(it.parts || []).map((p) => { if (p.changed) { p.rev = v; delete p.changed; } return p; });
    patchDoc('items', id, { parts }); patchDoc('sheets', it.sheetId, { revisions: [...clone(sh.revisions || []), { v, date: nowISO(), note: note.trim() }], status: 'kontrol' });
    render(); toast(`${sh.no} v${v} yayınlandı.`);
  },
  'mat-add': () => { const P = proj(); const m = clone((P.standards || DEFAULT_STD).malzemeler || []); m.push({ key: rid('m'), ad: 'Yeni malzeme', kalinlik: 18, kod: '', desen: false, renk: '#dddddd' }); patchDoc('projects', S.projectId, { standards: { malzemeler: m } }); render(); },
  'mat-del': (el) => { const P = proj(); const m = clone((P.standards || DEFAULT_STD).malzemeler || []); m.splice(+el.dataset.i, 1); patchDoc('projects', S.projectId, { standards: { malzemeler: m } }); render(); },
  'del-sample': () => {
    const sp = projectList().filter((p) => p.sample);
    const ids = new Set(sp.map((p) => p.id));
    const cnt = (col) => list(col).filter((d) => ids.has(d.projectId)).length;
    confirmModal('Örnek proje silinsin mi?', `${sp.map((p) => p.name).join(', ')} ve bağlı ${cnt('requests')} talep, ${cnt('sheets')} pafta, ${cnt('items')} imalat objesi silinir. Geri alınamaz.`, 'Sil', () => {
      ['requests', 'sheets', 'items'].forEach((col) => list(col).filter((d) => ids.has(d.projectId)).forEach((d) => deleteDoc(col, d.id)));
      sp.forEach((p) => deleteDoc('projects', p.id)); render(); toast('Örnek proje silindi.');
    });
  },
};

['pdf', 'svg', 'csv'].forEach((k) => { const f = ACT[k]; ACT[k] = (el, e) => { closeMenu(); return f(el, e); }; });
function closeMenu() { if (!S.ui.menu) return; S.ui.menu = false; const m = document.querySelector('.menu'); if (m) m.remove(); const b = document.querySelector('[data-act=menu]'); if (b) b.setAttribute('aria-expanded', 'false'); }
document.addEventListener('click', (e) => {
  if (S.ui.menu && !(e.target.closest && e.target.closest('.menu-wrap'))) closeMenu();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') return;
  e.preventDefault(); f(el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.ui.menu) { closeMenu(); return; }
  if (e.key === 'Escape' && !$('#modal-root').hidden) { closeModal(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')) { e.preventDefault(); const f = ACT[e.target.dataset.act]; if (f) f(e.target, e); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.matches && el.matches('textarea.input')) autosize(el);
  if (el.id === 'cmp-range') { el.closest('.compare').style.setProperty('--pos', el.value + '%'); return; }
  if (el.dataset.bind) { onBind(el); return; }
  if (el.dataset.part && el.tagName === 'INPUT') { const k = el.dataset.part; patchPart(S.ui.partSel, (p) => { p[k] = el.value; }); return; }
  if (el.dataset.std && el.tagName !== 'SELECT') { onStd(el); return; }
  if (el.dataset.mat && el.type !== 'checkbox' && el.type !== 'color') { onMat(el); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.classList.contains('proj-select')) { if (el.value === '__new') { openNewProject(); el.value = S.projectId || '__new'; } else { S.projectId = el.value; lsSet('pm.project', el.value); S.ui.openSheet = null; S.ui.partSel = null; go(S.route.view === 'talep' || (S.route.view === 'imalat' && S.route.id) ? (S.route.view === 'talep' ? 'talepler' : 'imalat') : S.route.view); } return; }
  if (el.id === 'file-in') { const f = el.files && el.files[0]; if (f) handleImageFile(f, S.ui.fileTarget || 'draft'); return; }
  if (el.dataset.bind && el.type === 'checkbox') { onBind(el); return; }
  if (el.dataset.sheetStatus) { patchDoc('sheets', el.dataset.sheetStatus, { status: el.value }); render(); return; }
  if (el.dataset.part && el.tagName === 'SELECT') { const k = el.dataset.part; patchPart(S.ui.partSel, (p) => { p[k] = el.value; }); setTimeout(render, 0); return; }
  if (el.dataset.std && el.tagName === 'SELECT') { onStd(el); return; }
  if (el.dataset.mat && (el.type === 'checkbox' || el.type === 'color')) { onMat(el); }
});
function onBind(el) {
  const b = el.dataset.bind; const r = R(); if (!r) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (b.startsWith('brief.')) patchReq({ draft: { brief: { [b.slice(6)]: val } } }, 700);
  else if (b.startsWith('pin.')) { const pid = b.slice(4); patchReq({ draft: { pins: clone(r.draft.pins || []).map((p) => (p.id === pid ? Object.assign(p, { text: val }) : p)) } }, 700); }
  else if (b === 'note') patchReq({ draft: { note: val } }, 700);
  else if (b.startsWith('scope.')) patchReq({ scope: { [b.slice(6)]: val } }, 700);
  else if (b.startsWith('opt.')) patchReq({ draft: { opts: { [b.slice(4)]: val } } }, 0);
  else if (b.startsWith('summary.')) { const n = +b.slice(8); const vs = clone(r.versions || []); if (vs[n - 1]) { vs[n - 1].summary = val; patchReq({ versions: vs }, 800); } return; }
  updatePromptPreview();
}
function onStd(el) {
  const path = el.dataset.std.split('.'); const patch = {}; let cur = patch;
  path.forEach((k, i) => { if (i === path.length - 1) cur[k] = el.value; else { cur[k] = {}; cur = cur[k]; } });
  patchDoc('projects', S.projectId, { standards: patch }, 700);
}
function onMat(el) {
  const [i, f] = el.dataset.mat.split('.'); const P = proj(); const m = clone((P.standards || DEFAULT_STD).malzemeler || []); if (!m[+i]) return;
  m[+i][f] = el.type === 'checkbox' ? el.checked : f === 'kalinlik' ? (parseFloat(el.value) || 0) : el.value;
  patchDoc('projects', S.projectId, { standards: { malzemeler: m } }, 700);
}

// yapıştır, sürükle-bırak
document.addEventListener('paste', (e) => {
  if (S.route.view !== 'talep') return;
  const item = [...((e.clipboardData && e.clipboardData.items) || [])].find((i) => i.type && i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault(); const f = item.getAsFile(); const r = R(); if (!r) return;
  if (r.draft) handleImageFile(f, 'draft'); else if (r.status === 'claudeda') handleImageFile(f, 'result'); else toast('Önce "Revizyon iste" ile yeni bir taslak aç.');
});
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('[data-drop]'); if (!z) return; e.preventDefault(); z.classList.remove('over'); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) handleImageFile(f, z.dataset.drop); });

// işaretleme
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const st = e.target.closest && e.target.closest('[data-draw]'); if (!st || e.button !== 0 || e.target.closest('.mk-badge')) return;
  const rc = st.getBoundingClientRect(); const fx = clamp01((e.clientX - rc.left) / rc.width), fy = clamp01((e.clientY - rc.top) / rc.height);
  drag = { st, rc, x0: fx, y0: fy, x1: fx, y1: fy, id: e.pointerId, el: null };
  try { st.setPointerCapture(e.pointerId); } catch (er) { /* yok */ }
  e.preventDefault();
});
document.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x1 = clamp01((e.clientX - drag.rc.left) / drag.rc.width); drag.y1 = clamp01((e.clientY - drag.rc.top) / drag.rc.height);
  const w = Math.abs(drag.x1 - drag.x0), h = Math.abs(drag.y1 - drag.y0);
  if (w > 0.012 || h > 0.012) {
    if (!drag.el) { drag.el = document.createElement('div'); drag.el.className = 'mk-temp'; drag.st.appendChild(drag.el); }
    Object.assign(drag.el.style, { left: Math.min(drag.x0, drag.x1) * 100 + '%', top: Math.min(drag.y0, drag.y1) * 100 + '%', width: w * 100 + '%', height: h * 100 + '%' });
  }
});
function endDrag(e, cancel) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null; if (d.el) d.el.remove(); if (cancel) return;
  const w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);
  const pin = w > 0.015 || h > 0.015 ? { x: MM(Math.min(d.x0, d.x1) * 1e4) / 1e4, y: MM(Math.min(d.y0, d.y1) * 1e4) / 1e4, w: MM(w * 1e4) / 1e4, h: MM(h * 1e4) / 1e4 } : { x: MM(d.x0 * 1e4) / 1e4, y: MM(d.y0 * 1e4) / 1e4, w: 0, h: 0 };
  pin.id = rid('k'); pin.text = '';
  const r = R(); if (!r || !r.draft) return;
  patchReq({ draft: { pins: [...clone(r.draft.pins || []), pin] } });
  render();
  const t = document.getElementById('pin-' + pin.id); if (t) { t.focus(); t.scrollIntoView({ block: 'nearest' }); }
}
document.addEventListener('pointerup', (e) => endDrag(e, false));
document.addEventListener('pointercancel', (e) => endDrag(e, true));

// =====================================================================
// başlat
// =====================================================================
S.route = parseHash();
render();
if (!window.claude || !window.claude.use) { S.dbState = 'none'; render(); }
else {
  const slow = setTimeout(() => { if (S.dbState === 'loading') { S.dbState = 'slow'; render(); } }, 10000);
  window.claude.use('db').then((db) => {
    if (!db) { clearTimeout(slow); S.dbState = 'none'; render(); return; }
    S.db = db; subscribe();
    const iv = setInterval(() => { if (COLS.every((c) => S.loaded[c])) { clearTimeout(slow); clearInterval(iv); } }, 500);
  }, () => { S.dbState = 'none'; render(); });
  window.claude.use('assets').then((a) => { S.assets = a; }, () => {});
  window.claude.use('sample').then((s) => { S.sample = s; scheduleRender(); }, () => {});
  window.claude.use('downloads').then((d) => { S.downloads = d; }, () => {});
}
})();
</script>
